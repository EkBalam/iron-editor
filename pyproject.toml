[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iron-editor"
dynamic = ["version"]
description = 'Iron Editor is a terminal-based code editor built with Textual.'
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ['code-editor', 'terminal-base', 'TUI']
authors = [
  { name = "Ekbalam", email = "" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = ["textual[syntax]==7.5.0"]

[project.urls]
Documentation = "https://github.com/Adan/iron-editor#readme"
Issues = "https://github.com/Adan/iron-editor/issues"
Source = "https://github.com/Adan/iron-editor"

[tool.hatch.version]
path = "src/iron_editor/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/iron_editor tests}"

[tool.coverage.run]
source_pkgs = ["iron_editor", "tests"]
branch = true
parallel = true
omit = [
  "src/iron_editor/__about__.py",
]

[tool.coverage.paths]
iron_editor = ["src/iron_editor", "*/iron-editor/src/iron_editor"]
tests = ["tests", "*/iron-editor/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[project.scripts]
ironedit = "iron_editor.main:main"